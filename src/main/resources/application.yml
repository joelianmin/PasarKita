spring:
  application:
    name: pasarkita
  datasource:
    url: jdbc:postgresql://localhost:5432/pasarkita
    username: pasarkita
    password: pasarkita
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

pasarkita:
  tax-api:
    url: http://localhost:8089
  payment-gateway:
    url: http://localhost:8089
  notification:
    url: http://localhost:8089
