# Versi tanpa Docker. __DATA__ diganti oleh native.sh dengan folder data.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: __DATA__/tempo/traces
    wal:
      path: __DATA__/tempo/wal
